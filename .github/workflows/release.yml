name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/go.mod
          cache-dependency-path: packages/cli/go.sum

      - name: Preflight — verify New Relic vars are set
        env:
          NR_ENDPOINT: ${{ vars.NR_ENDPOINT }}
          NR_API_KEY: ${{ vars.NR_API_KEY }}
        run: |
          if [[ -z "$NR_ENDPOINT" || -z "$NR_API_KEY" ]]; then
            echo "::error::NR_ENDPOINT and NR_API_KEY must be set as repository variables (not secrets) at Settings → Secrets and variables → Actions → Variables. See RELEASING.md."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: packages/cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NR_ENDPOINT: ${{ vars.NR_ENDPOINT }}
          NR_API_KEY: ${{ vars.NR_API_KEY }}

  publish-npm:
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
